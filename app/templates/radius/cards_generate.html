{% extends "admin/_admin_layout.html" %}
{% block title %}إنشاء كروت{% endblock %}
{% block page_icon %}<i class="fa-solid fa-wand-magic-sparkles"></i>{% endblock %}
{% block page_title %}إنشاء كروت{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('radius.cards_generate') }}">
  <div class="card">
    <div class="card-header">
      <span class="title">معطيات الدفعة</span>
    </div>
    <div class="card-body">
      <div class="form-row">
        <label>الباقة *</label>
        <div class="field">
          <select name="plan_id" required>
            <option value="">— اختر —</option>
            {% for p in plans %}
              <option value="{{ p.id }}"
                {% if form.get('plan_id')|string == p.id|string %}selected{% endif %}>
                {{ p.name }} · {{ "%.2f"|format(p.price) }} {{ p.currency }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>عدد البطاقات *</label>
        <div class="field">
          <input type="number" name="count" min="1" max="2000" required
                 value="{{ form.get('count') or 20 }}">
        </div>
      </div>
      <div class="form-row">
        <label>بادئة اسم المستخدم</label>
        <div class="field">
          <input type="text" name="username_prefix" value="{{ form.get('username_prefix') or '' }}" placeholder="c-">
          <div class="hint">تُضاف في بداية كل بطاقة (اختياري)</div>
        </div>
      </div>
      <div class="form-row">
        <label>طول اسم المستخدم</label>
        <div class="field">
          <input type="number" name="username_length" min="4" max="16" value="{{ form.get('username_length') or 8 }}">
        </div>
      </div>
      <div class="form-row">
        <label>طول كلمة المرور</label>
        <div class="field">
          <input type="number" name="password_length" min="4" max="20" value="{{ form.get('password_length') or 6 }}">
        </div>
      </div>
      <div class="form-row">
        <label>ملاحظات</label>
        <div class="field">
          <textarea name="notes">{{ form.get('notes') or '' }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-primary" type="submit">
      <i class="fa-solid fa-wand-magic-sparkles"></i> توليد الآن
    </button>
    <a class="btn btn-secondary" href="{{ url_for('radius.cards_batches') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
