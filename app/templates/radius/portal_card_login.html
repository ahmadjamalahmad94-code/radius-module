<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card User Portal - HobeRadius</title>
  <style>
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f8fafc;color:#0f172a}.portal{max-width:460px;margin:8vh auto;padding:32px;background:white;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 24px 70px rgba(15,23,42,.08)}
    label{display:block;margin:14px 0;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:12px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:800}.note{color:#64748b;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <main class="portal" data-testid="card-portal-login">
    <h1>Card User Portal</h1>
    <p class="note">Sign in with a purchased card to view wallet, marketplace, active card, usage, and notifications.</p>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
      <label>Card username <input name="card_username" required></label>
      <label>Card password <input name="card_password" type="password" required></label>
      <button type="submit">Open portal</button>
    </form>
  </main>
</body>
</html>
