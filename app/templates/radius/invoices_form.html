{% extends "admin/_admin_layout.html" %}
{% block title %}فاتورة جديدة{% endblock %}
{% block page_icon %}<i class="fa-solid fa-file-invoice-dollar"></i>{% endblock %}
{% block page_title %}فاتورة جديدة{% endblock %}
{% block content %}
<form method="post">
  <div class="card"><div class="card-header"><span class="title">معلومات الفاتورة</span></div><div class="card-body">
    <div class="form-row"><label>المشترك *</label>
      <div class="field"><select name="subscriber_id" required>
        <option value="">— اختر —</option>
        {% for s in subs %}<option value="{{ s.id }}">{{ s.username }} — {{ s.full_name or '—' }}</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>الباقة</label>
      <div class="field"><select name="plan_id">
        <option value="">— بدون —</option>
        {% for p in plans %}<option value="{{ p.id }}">{{ p.name }} ({{ "%.2f"|format(p.price) }})</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>المبلغ *</label>
      <div class="field"><input type="number" step="0.01" name="amount" required min="0" value="0"></div></div>
    <div class="form-row"><label>الاتجاه</label>
      <div class="field"><select name="direction">
        {% for d in ['charge','refund','deposit','withdraw','credit'] %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>نوع الخدمة</label>
      <div class="field"><select name="service_type">
        {% for t in ['Hotspot','PPPoE','Balance'] %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>طريقة الدفع</label>
      <div class="field"><select name="payment_method">
        {% for m in ['cash','transfer','card','online','manual'] %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>الحالة</label>
      <div class="field"><select name="status">
        {% for s in ['paid','pending','failed'] %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select></div></div>
    <div class="form-row"><label>تنتهي في</label>
      <div class="field"><input type="date" name="expiration_at"></div></div>
    <div class="form-row"><label>ملاحظات</label>
      <div class="field"><textarea name="note"></textarea></div></div>
  </div></div>
  <div class="actions-bar">
    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> إنشاء</button>
    <a class="btn btn-secondary" href="{{ url_for('radius.inv_list') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
