# إعداد استخراج النصوص لـ pybabel — أساس التدويل (i18n).
# لغة المصدر = العربية (النص العربي نفسه هو الـ msgid).
#
# الاستخراج:   pybabel extract -F babel.cfg -k _l -o translations/messages.pot app
# التحديث:     pybabel update  -i translations/messages.pot -d translations
# الترجمة:     pybabel compile -d translations
# (التفاصيل الكاملة في I18N.md)

[python: app/**.py]

[jinja2: app/templates/**.html]
# trim_blocks/lstrip_blocks لتطابق إعدادات Jinja في Flask (whitespace control).
trim_blocks = True
lstrip_blocks = True
