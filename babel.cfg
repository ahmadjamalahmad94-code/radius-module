# إعداد استخراج النصوص لـ pybabel — أساس التدويل (i18n).
# لغة المصدر = العربية (النص العربي نفسه هو الـ msgid).
#
# الطريق المعتمد (يستعمل هذا الملف + المفاتيح الصحيحة):
#   python tools/i18n_master.py sync      # استخراج ⇒ translations/messages.pot
#   python tools/i18n_master.py export    # ⇒ translations/MASTER.csv
#   python tools/i18n_master.py import    # MASTER.csv ⇒ .po ⇒ .mo
# مكافئ يدويّ (من جذر المشروع):
#   pybabel extract -F babel.cfg -k _l -k _tr -k N_ -k lazy_gettext -o translations/messages.pot .
#   ⚠ هذا الأمر اليدويّ ناقص: يتخطّى مجلّدات «_» (app/templates/_partials، _components)
#   ونصوص JS الثابتة — استعمل دائمًا: python tools/i18n_master.py sync
# (التفاصيل الكاملة في I18N.md)

[python: app/**.py]

[jinja2: app/templates/**.html]
# trim_blocks/lstrip_blocks لتطابق إعدادات Jinja في Flask (whitespace control).
trim_blocks = True
lstrip_blocks = True

[jinja2: app/radius/templates/**.html]
trim_blocks = True
lstrip_blocks = True

# JavaScript الثابت (app/static/js/*.js، الدالّة hrT) لا يُستخرَج بـ Babel: مُرمِّزه يُفوّت
# hrT() داخل القوالب الحرفيّة المتداخلة. يستخرجه tools/i18n_master.py sync عبر
# tools/i18n_inventory.py ويكتب قائمته في translations/js_msgids.json (تقرؤها اللوحة).
