# ─────────────────────────────────────────────────────────────────────────────
# clients.conf — قائمة الـ NAS clients المعرَّفة لـ FreeRADIUS
# ─────────────────────────────────────────────────────────────────────────────
# لتجنب إعادة تشغيل FreeRADIUS عند إضافة NAS جديد، نستخدم backend SQL أيضًا
# (انظر mods-enabled/sql + clients = yes) لقراءة جدول nas.
# هذا الملف يبقى بحد أدنى — فقط لـ localhost (testing) + clients ثابتة.
# ─────────────────────────────────────────────────────────────────────────────

client localhost {
    ipaddr      = 127.0.0.1
    secret      = testing123
    require_message_authenticator = no
    nas_type    = other
    shortname   = localhost
}

client docker_network {
    ipaddr      = 172.16.0.0/12
    secret      = testing123
    require_message_authenticator = no
    nas_type    = other
    shortname   = docker
}

# ─────────────────────────────────────────────────────────────────────────────
# أجهزة MikroTik الإنتاجية — تُضاف هنا يدويًا حتى يكتمل DB sync
# (nas_devices ↔ nas table). لإضافة جهاز جديد:
#   1. أنشئ client block جديد بـ ipaddr/secret/shortname المطابقة لـ
#      /admin/radius/devices في HobeRadius UI.
#   2. commit + push من جهازك المحلّي.
#   3. على الـ VPS: git pull + docker compose -f deploy/docker-compose.yml
#      build freeradius && docker compose ... up -d --force-recreate freeradius
# ─────────────────────────────────────────────────────────────────────────────

client mt_main_213_6_169_138 {
    ipaddr      = 213.6.169.138
    secret      = 123123
    require_message_authenticator = no
    nas_type    = mikrotik
    shortname   = mt-main
}

# ─────────────────────────────────────────────────────────────────────────────
# R11 — WireGuard tunnel peers
# ─────────────────────────────────────────────────────────────────────────────
# OBSOLETE: removed in postmortem #18.
#
# This block hard-coded the FIRST WireGuard router at 10.10.0.2 with a
# shared secret of "123123". After the Setup Wizard v3 went online, the
# wizard auto-provisions every WG router into
#   /data/freeradius-clients-wizard/wizard-run-<id>.conf
# with a strong random secret. When a new wizard run got allocated IP
# 10.10.0.2 (after operator cleared the pool), this block collided with
# the wizard's entry — same ipaddr, FreeRADIUS rejects duplicates →
# crash loop.
#
# Removing here. The wizard owns all VPN-range clients now. Manually-
# managed routers (mt_main_213_6_169_138 etc.) remain.
#
# Wizard-managed clients live in:
#   /data/freeradius-clients-wizard/wizard-run-<id>.conf
# (loaded by the `$INCLUDE /data/freeradius-clients-wizard/` line at the
# bottom of this file).


# ─────────────────────────────────────────────────────────────────────────────
# Setup Wizard v3 — auto-provisioned clients
# ─────────────────────────────────────────────────────────────────────────────
# The wizard writes one .conf file per router run to the directory below.
# Both containers share /data via the instance/ bind mount:
#   hoberadius writes to  /app/instance/freeradius-clients-wizard/*.conf
#   freeradius  reads from /data/freeradius-clients-wizard/*.conf
#
# Reload mechanism: hoberadius touches `.reload-trigger` after each write.
# The entrypoint's background watcher kills freeradius (the supervisor
# loop in entrypoint.sh restarts it). Total reload: ~5 seconds.
#
# To revoke a router's RADIUS access manually:
#   rm /opt/hoberadius/instance/freeradius-clients-wizard/wizard-run-<id>.conf
#   touch /opt/hoberadius/instance/freeradius-clients-wizard/.reload-trigger
# NOTE: trailing slash matters — FreeRADIUS 3.x's $INCLUDE does
# NOT support character globbing or wildcards. Quoting from
# `man radiusd.conf`: "There are no character globbing or
# wildcards supported." An earlier revision of this file used
# `<path>/*.conf`, which FR tried to open as a literal filename,
# crashing the daemon at startup with:
#   Unable to open file "/data/freeradius-clients-wizard/*.conf":
#   No such file or directory
# The supervisor loop in entrypoint.sh then restarted FR every
# second forever (issue #17 in POSTMORTEM_V3_REBUILD_SESSION.md).
# Always use the directory form (trailing slash); FR auto-loads
# every `.conf` file in it on read.
$INCLUDE /data/freeradius-clients-wizard/
