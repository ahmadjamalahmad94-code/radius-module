# ─────────────────────────────────────────────────────────────────────────────
# clients.conf — قائمة الـ NAS clients المعرَّفة لـ FreeRADIUS
# ─────────────────────────────────────────────────────────────────────────────
# لتجنب إعادة تشغيل FreeRADIUS عند إضافة NAS جديد، نستخدم backend SQL أيضًا
# (انظر mods-enabled/sql + clients = yes) لقراءة جدول nas.
# هذا الملف يبقى بحد أدنى — فقط لـ localhost (testing) + clients ثابتة.
# ─────────────────────────────────────────────────────────────────────────────

client localhost {
    ipaddr      = 127.0.0.1
    secret      = testing123
    require_message_authenticator = no
    nas_type    = other
    shortname   = localhost
}

client docker_network {
    ipaddr      = 172.16.0.0/12
    secret      = testing123
    require_message_authenticator = no
    nas_type    = other
    shortname   = docker
}

# باقي الـ NAS تأتي من جدول `nas` في SQLite (يديره HobeRadius).
# انظر mods-enabled/sql: read_clients = yes
