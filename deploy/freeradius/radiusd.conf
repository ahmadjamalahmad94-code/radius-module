# ─────────────────────────────────────────────────────────────────────────────
# radiusd.conf — تكوين FreeRADIUS الرئيسي (مبسَّط لـ HobeRadius).
# ─────────────────────────────────────────────────────────────────────────────
prefix         = /usr
exec_prefix    = /usr
sysconfdir     = /etc
localstatedir  = /var
sbindir        = /usr/sbin
logdir         = /var/log/freeradius
raddbdir       = /etc/freeradius
radacctdir     = /var/log/freeradius/radacct
name           = freeradius
confdir        = ${raddbdir}
modconfdir     = ${confdir}/mods-config
certdir        = ${confdir}/certs
cadir          = ${confdir}/certs
run_dir        = ${localstatedir}/run/${name}
db_dir         = ${raddbdir}
libdir         = /usr/lib/freeradius
pidfile        = ${run_dir}/${name}.pid

correct_escapes = true
max_request_time = 30
cleanup_delay  = 5
max_requests   = 16384
hostname_lookups = no

# ─ listening sockets ─
listen {
    type    = auth
    ipaddr  = *
    port    = 1812
    limit {
        max_connections = 16
        lifetime        = 0
        idle_timeout    = 30
    }
}

listen {
    ipaddr  = *
    port    = 1813
    type    = acct
    limit {}
}

# ─ Dynamic Authorization (CoA/Disconnect inbound — لو HobeRadius أرسلها لـ FR ـ) ─
# نحن نُرسل CoA مباشرة من HobeRadius لـ MikroTik (port 3799 عليها)،
# لذا لا نحتاج هذا الـ listener، لكن نُبقيه للتوسع.

log {
    destination     = stdout      # docker → stdout
    file            = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names  = no
    auth            = yes
    auth_badpass    = no
    auth_goodpass   = no
    msg_denied      = "You are already logged in - access denied"
}

checkrad   = ${sbindir}/checkrad

security {
    user             = freerad
    group            = freerad
    allow_core_dumps = no
    max_attributes   = 200
    reject_delay     = 1
    status_server    = yes
}

proxy_requests  = no

$INCLUDE clients.conf

thread pool {
    start_servers       = 5
    max_servers         = 32
    min_spare_servers   = 3
    max_spare_servers   = 10
    max_queue_size      = 65536
    max_requests_per_server = 0
    auto_limit_acct     = no
}

modules {
    $INCLUDE mods-enabled/
}

instantiate {}

policy {
    $INCLUDE policy.d/
}

$INCLUDE sites-enabled/
