# Hoberadius nginx — main config.
#
# This file REPLACES the stock /etc/nginx/nginx.conf so we can
# add a top-level `stream {}` block alongside the existing
# `http {}` reverse-proxy (which still lives in conf.d/).
#
# Layout:
#   http {}    — admin UI + REST API reverse proxy (default.conf)
#   stream {}  — per-router TCP forwarders (auto-generated by
#                NPC into /etc/nginx/streams.d/*.conf)

user  nginx;
worker_processes  auto;
# Stress L01: each proxied request holds two descriptors (client + upstream).
# Matches the container ulimit (docker-compose.yml → nofile 65535).
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    # Per nginx worker (worker_processes auto = one per CPU). Was 1024.
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # ── /api/ load shedding (stress L01, 2026-09-28) ─────────────────────────
    # At ~1000 concurrent connections the app crash-looped (EMFILE) and 73% of
    # requests failed with raw 502s. Excess load now gets a clean JSON 503
    # (`location @hr_api_overloaded`, Retry-After: 2) BEFORE it reaches
    # gunicorn. Used by `location /api/` in default.conf and the :8443 block;
    # zones live here so every server block (incl. a TLS nginx.conf) can use
    # them. Sizing — measured app ceiling ≈ 240 req/s (one gunicorn process):
    #   hr_api_rate     200 req/s per client IP, burst 400 (no delay). A busy
    #                   shop (panel + mobile app + hotspot store pages behind
    #                   one NAT IP) stays far below: tens of req/s.
    #   hr_api_conn_ip  256 in-flight /api/ requests per client IP.
    #   hr_api_conn_all 512 in-flight /api/ requests in total ≈ 2 s of queue
    #                   at the measured ceiling — more would only add latency.
    # A load generator on ONE IP will see 503s above ~200 req/s by design.
    limit_req_zone  $binary_remote_addr zone=hr_api_rate:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=hr_api_conn_ip:10m;
    limit_conn_zone $server_name        zone=hr_api_conn_all:1m;
    limit_req_status  503;
    limit_conn_status 503;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}

# NPC remote-tunnel: top-level stream block forwards TCP from
# allocated public ports (51000-51199 by default) to the
# router's reachable address (VPN peer or public IP).
#
# Per-router blocks live in /etc/nginx/streams.d/ which is
# mounted from /etc/hoberadius/nginx-streams.d on the host —
# the same directory hoberadius writes into when an NPC
# remote-access apply succeeds.
stream {
    log_format basic '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr"';
    access_log /var/log/nginx/stream.log basic;
    error_log  /var/log/nginx/stream-error.log notice;

    include /etc/nginx/streams.d/*.conf;
}
