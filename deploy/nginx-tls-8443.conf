# HobeRadius — HTTPS (port 8443) over a SELF-SIGNED certificate.
#
# PURELY ADDITIVE. This server block is ENABLED by nginx-entrypoint.sh only
# when the self-signed cert exists (the entrypoint copies this file into
# conf.d/8443-ssl.conf at start). It NEVER touches the :80 server block
# (deploy/nginx.conf / default.conf) — the panel keeps serving on http://<IP>
# exactly as before, regardless of TLS state.
#
# The owner accesses the panel by IP (no domain, no Let's Encrypt) — the
# browser shows a one-time "not trusted" warning for the self-signed cert.
# The upstream `hoberadius_app` is defined once in default.conf and resolved
# globally within http{}, so we do NOT redefine it here (would be a duplicate).

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/selfsigned.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HRSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location /static/ {
        proxy_pass http://hoberadius_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location = /admin/radius/_health {
        proxy_pass http://hoberadius_app;
        access_log off;
    }

    # Internal-only API is never exposed through the public listener.
    location ~ ^/api/v1/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://hoberadius_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
