# HobeRadius — HTTPS (port 8443) over a SELF-SIGNED certificate.
#
# PURELY ADDITIVE. This server block is ENABLED by nginx-entrypoint.sh only
# when the self-signed cert exists (the entrypoint copies this file into
# conf.d/8443-ssl.conf at start). It NEVER touches the :80 server block
# (deploy/nginx.conf / default.conf) — the panel keeps serving on http://<IP>
# exactly as before, regardless of TLS state.
#
# The owner accesses the panel by IP (no domain, no Let's Encrypt) — the
# browser shows a one-time "not trusted" warning for the self-signed cert.
# The app is reached through the `$hr_app` variable + Docker's resolver (set in
# this server block, exactly like default.conf) — no static `upstream {}`, so a
# recreated hoberadius container is re-resolved within 10 s (fix3 integration).

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # ── Upstream re-resolve (fix3 integration, the client20 502 incident) ──
    # `proxy_pass` to a VARIABLE makes nginx resolve `hoberadius` through
    # Docker's embedded DNS (127.0.0.11) at request time, re-checking every
    # 10 s. A static `upstream { server hoberadius:8000; }` was resolved ONCE at
    # nginx start: recreating the hoberadius container gave it a new IP and
    # nginx kept proxying to the dead one (502) until nginx itself restarted.
    # It also means nginx starts even while hoberadius is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $hr_app http://hoberadius:8000;

    ssl_certificate     /etc/nginx/tls/selfsigned.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HRSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location /static/ {
        proxy_pass $hr_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location = /admin/radius/_health {
        proxy_pass $hr_app;
        access_log off;
    }

    # Internal-only API is never exposed through the public listener.
    location ~ ^/api/v1/internal/ {
        return 404;
    }

    # معالج ترحيل بيانات العملاء — رفع تفريغ قاعدة كبير (قد يبلغ مئات
    # الميغابايت). حدّ جسم كبير + مهلة أطول + بثّ الرفع للـupstream. المسار
    # العامّ يبقى عند الحدّ الافتراضيّ. يُفضَّل رفع النسخة المضغوطة .gz.
    location /admin/radius/migrate/ {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ── /api/ with load shedding (zones + sizing: nginx-main.conf) ──
    # Same proxying as `location /`; over the limits nginx answers a JSON 503
    # instead of letting gunicorn drown. (The app's own 503s pass through
    # untouched: proxy_intercept_errors is off.)
    location /api/ {
        limit_req  zone=hr_api_rate burst=400 nodelay;
        limit_conn hr_api_conn_ip 256;
        limit_conn hr_api_conn_all 512;
        error_page 503 = @hr_api_overloaded;
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    location @hr_api_overloaded {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"ok":false,"error":{"code":"server_busy","message":"الخادم مشغول الآن — أعد المحاولة بعد لحظات.","details":{}}}';
    }

    location / {
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
