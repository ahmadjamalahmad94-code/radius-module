services:
  hoberadius:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hoberadius:latest
    container_name: hoberadius
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../instance:/app/instance              # SQLite DB persists
      - ../logs:/app/logs
      # Phase M — WireGuard peer provisioning, split design:
      # • /etc/wireguard/wg0.conf  stays root-only on the host (it
      #   holds the server private key). NOT mounted.
      # • /etc/hoberadius/wg-peers.d/  is the container's domain;
      #   one file per peer. The path-unit on the host watches it
      #   and reloads `wg syncconf`. Created with gid=999 by
      #   `deploy.sh init-wg-reloader`.
      - /etc/hoberadius/wg-peers.d:/etc/hoberadius/wg-peers.d:rw
    networks: [hrnet]
    expose: ["8000"]

  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    image: hoberadius-freeradius:latest
    container_name: hoberadius-freeradius
    restart: unless-stopped
    depends_on:
      - hoberadius
    volumes:
      - ../instance:/data              # SQLite DB shared (read+write radacct)
      - ../logs/freeradius:/var/log/freeradius
    # نُحمِّل نفس .env الذي يستهلكه hoberadius — هذا يضمن أن
    # HOBERADIUS_INTERNAL_SECRET متطابق على الطرفَين دون الاعتماد على
    # interpolation ${VAR:-} الذي يقرأ من dir الـ compose file، لا من cwd.
    env_file: ../.env
    environment:
      - FREERADIUS_DEBUG_LEVEL=        # ضع "-X" للـ verbose debugging
    ports:
      - "1812:1812/udp"                # auth
      - "1813:1813/udp"                # accounting
      - "3799:3799/udp"                # CoA / Disconnect-Request (RFC 5176)
    networks: [hrnet]
    healthcheck:
      # نتأكّد أنّ المنفذ UDP 1812 (RADIUS auth) مفتوح داخل الـ container.
      # نستعمل /proc/net/udp بدلاً من `ss` لأن iproute2 غير مثبَّت في
      # image الـ freeradius — أي بدون أي اعتمادات خارجية: شل + procfs فقط.
      # 1812 hex = 0714. الـ space النهائي قبل '0' يطابق rem_address=0:0
      # (السطر الذي يمثّل listening socket فعلاً، لا attached client).
      test: ["CMD-SHELL", "grep -q ':0714 0' /proc/net/udp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: hoberadius-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [hrnet]
    depends_on:
      - hoberadius

  backup:
    image: alpine:3.20
    container_name: hoberadius-backup
    restart: unless-stopped
    volumes:
      - ../instance:/data:ro
      - ../backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache sqlite tzdata && crond -f -l 8 -L /dev/stdout"]
    command: ["sh"]
    environment:
      - TZ=Asia/Amman
    networks: [hrnet]

networks:
  hrnet:
    driver: bridge
