services:
  hoberadius:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hoberadius:latest
    container_name: hoberadius
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../instance:/app/instance              # SQLite DB persists
      - ../logs:/app/logs
      # Phase M — WireGuard peer provisioning, split design:
      # • /etc/wireguard/wg0.conf  stays root-only on the host (it
      #   holds the server private key). NOT mounted.
      # • /etc/hoberadius/wg-peers.d/  is the container's domain;
      #   one file per peer. The path-unit on the host watches it
      #   and reloads `wg syncconf`. Created with gid=999 by
      #   `deploy.sh init-wg-reloader`.
      - /etc/hoberadius/wg-peers.d:/etc/hoberadius/wg-peers.d:rw
      # NPC remote-tunnel (Phase 5R): hoberadius writes per-router
      # nginx stream config files here; the nginx container reads
      # the same directory + auto-reloads via its sidecar loop.
      - /etc/hoberadius/nginx-streams.d:/etc/hoberadius/nginx-streams.d:rw
    networks: [hrnet]
    expose: ["8000"]

  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    image: hoberadius-freeradius:latest
    container_name: hoberadius-freeradius
    restart: unless-stopped
    depends_on:
      - hoberadius
    volumes:
      - ../instance:/data              # SQLite DB shared (read+write radacct)
      - ../logs/freeradius:/var/log/freeradius
    # نُحمِّل نفس .env الذي يستهلكه hoberadius — هذا يضمن أن
    # HOBERADIUS_INTERNAL_SECRET متطابق على الطرفَين دون الاعتماد على
    # interpolation ${VAR:-} الذي يقرأ من dir الـ compose file، لا من cwd.
    env_file: ../.env
    environment:
      - FREERADIUS_DEBUG_LEVEL=        # ضع "-X" للـ verbose debugging
    ports:
      - "1812:1812/udp"                # auth
      - "1813:1813/udp"                # accounting
      - "3799:3799/udp"                # CoA / Disconnect-Request (RFC 5176)
    networks: [hrnet]
    healthcheck:
      # F1 — process-presence check بدون أي اعتمادات إضافية.
      # الـ image الرسمي freeradius/freeradius-server:3.2.5 لا يحوي
      # iproute2 (ss) ولا net-tools (netstat). نتحقّق من العملية:
      #   1) pgrep -x freeradius  (الاسم المعتاد في الـ debian package)
      #   2) pgrep -x radiusd     (الاسم البديل على بعض البناءات)
      #   3) fallback عبر /proc/*/comm + grep — يعمل حتى لو procps غير
      #      مثبَّت (grep و procfs مضمونان في كل صورة Linux).
      test: ["CMD-SHELL", "pgrep -x freeradius >/dev/null 2>&1 || pgrep -x radiusd >/dev/null 2>&1 || grep -lE '^(freeradius|radiusd)$' /proc/[0-9]*/comm >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: hoberadius-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Phase 5R NPC remote-tunnel — 200 TCP ports for Winbox /
      # SSH / WebFig / API forwarding to internal routers via
      # the VPS public IP. See app/radius/services/npc_remote_tunnel.py
      # for the allocator + nginx-stream config generator.
      - "51000-51199:51000-51199/tcp"
    volumes:
      # The main nginx.conf is now our own — it includes the
      # http {} block (existing reverse proxy) plus a stream {}
      # block at top level for the per-router TCP forwarders.
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/hoberadius/nginx-streams.d:/etc/nginx/streams.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    networks: [hrnet]
    depends_on:
      - hoberadius

  backup:
    image: alpine:3.20
    container_name: hoberadius-backup
    restart: unless-stopped
    volumes:
      - ../instance:/data:ro
      - ../backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache sqlite tzdata && crond -f -l 8 -L /dev/stdout"]
    command: ["sh"]
    environment:
      - TZ=Asia/Amman
    networks: [hrnet]

networks:
  hrnet:
    driver: bridge
