services:
  hoberadius:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hoberadius:latest
    container_name: hoberadius
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../instance:/app/instance      # SQLite DB persists
      - ../logs:/app/logs
    networks: [hrnet]
    expose: ["8000"]

  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    image: hoberadius-freeradius:latest
    container_name: hoberadius-freeradius
    restart: unless-stopped
    depends_on:
      - hoberadius
    volumes:
      - ../instance:/data              # SQLite DB shared (read+write radacct)
      - ../logs/freeradius:/var/log/freeradius
    # نُحمِّل نفس .env الذي يستهلكه hoberadius — هذا يضمن أن
    # HOBERADIUS_INTERNAL_SECRET متطابق على الطرفَين دون الاعتماد على
    # interpolation ${VAR:-} الذي يقرأ من dir الـ compose file، لا من cwd.
    env_file: ../.env
    environment:
      - FREERADIUS_DEBUG_LEVEL=        # ضع "-X" للـ verbose debugging
    ports:
      - "1812:1812/udp"                # auth
      - "1813:1813/udp"                # accounting
      - "3799:3799/udp"                # CoA / Disconnect-Request (RFC 5176)
    networks: [hrnet]
    healthcheck:
      # ـ نتأكّد أنّ المنفذ UDP 1812 مفتوح داخل الـ container ـ
      test: ["CMD-SHELL", "ss -lun | grep -q ':1812' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: hoberadius-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [hrnet]
    depends_on:
      - hoberadius

  backup:
    image: alpine:3.20
    container_name: hoberadius-backup
    restart: unless-stopped
    volumes:
      - ../instance:/data:ro
      - ../backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache sqlite tzdata && crond -f -l 8 -L /dev/stdout"]
    command: ["sh"]
    environment:
      - TZ=Asia/Amman
    networks: [hrnet]

networks:
  hrnet:
    driver: bridge
