# HobeRadius — nginx reverse proxy
# يُتوقّع: شهادة Let's Encrypt في /etc/letsencrypt/live/<domain>/
# استبدل YOUR_DOMAIN قبل التشغيل.

upstream hoberadius_app {
    # اسم الخدمة في docker-compose = hoberadius (تغيّر من "app" مع
    # تنظيم الـ compose في bb77bf3). docker DNS يحلّ اسم الـ service
    # داخل شبكة hrnet.
    server hoberadius:8000;
    keepalive 32;
}

# HTTP → HTTPS + ACME challenge
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # static (يخدمها nginx مباشرة لو موجودة)
    location /static/ {
        proxy_pass http://hoberadius_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # health (للـ uptime checkers — بدون auth)
    location = /admin/radius/_health {
        proxy_pass http://hoberadius_app;
        access_log off;
    }

    location / {
        proxy_pass http://hoberadius_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
