# HobeRadius — nginx reverse proxy (افتراضي HTTP-only)
#
# هذا الـ config يعمل من اللحظة الأولى بدون شهادة TLS. كافٍ للوصول عبر
# http://<VPS_IP>/ مباشرة. لـ TLS مع دومين فعلي:
#   1. shell: sudo bash deploy/deploy.sh tls <domain>
#   2. أو يدوياً: انسخ deploy/nginx.tls.conf.example فوق nginx.conf
#      مع استبدال <DOMAIN>.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── Upstream re-resolve (fix3 integration, the client20 502 incident) ──
    # `proxy_pass` to a VARIABLE makes nginx resolve `hoberadius` through
    # Docker's embedded DNS (127.0.0.11) at request time, re-checking every
    # 10 s. A static `upstream { server hoberadius:8000; }` was resolved ONCE at
    # nginx start: recreating the hoberadius container gave it a new IP and
    # nginx kept proxying to the dead one (502) until nginx itself restarted.
    # It also means nginx starts even while hoberadius is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $hr_app http://hoberadius:8000;

    # ACME challenge — يبقى نشطاً ليعمل deploy.sh tls لاحقاً دون تعديل
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location /static/ {
        proxy_pass $hr_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location = /admin/radius/_health {
        proxy_pass $hr_app;
        access_log off;
    }

    # ـ حماية المسارات الداخلية ـ
    # /api/v1/internal/* مخصّص للاستخدام داخل docker network فقط
    # (FreeRADIUS → hoberadius:8000 مباشرة، لا يمرّ عبر nginx). نحظره من
    # الخارج كي لا يتعرّض أي endpoint داخلي للاحتمال — الـ secret لا يزال
    # خط الدفاع الأول، هذا belt-and-suspenders.
    # regex location يُطابَق قبل prefix `location /` حسب nginx ordering.
    location ~ ^/api/v1/internal/ {
        return 404;
    }

    # معالج ترحيل بيانات العملاء — رفع تفريغ قاعدة كبير (قد يبلغ مئات
    # الميغابايت). حدّ جسم كبير + مهلة أطول (تحليل ملفّ ضخم يأخذ وقتًا) +
    # بثّ الرفع للـupstream دون تخزينه كاملًا في nginx. المسار العامّ يبقى
    # عند الحدّ الافتراضيّ. يُفضَّل رفع النسخة المضغوطة .gz (أصغر بكثير).
    location /admin/radius/migrate/ {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ── /api/ with load shedding (zones + sizing: nginx-main.conf) ──
    # Same proxying as `location /`; over the limits nginx answers a JSON 503
    # instead of letting gunicorn drown. (The app's own 503s pass through
    # untouched: proxy_intercept_errors is off.)
    location /api/ {
        limit_req  zone=hr_api_rate burst=400 nodelay;
        limit_conn hr_api_conn_ip 256;
        limit_conn hr_api_conn_all 512;
        error_page 503 = @hr_api_overloaded;
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    location @hr_api_overloaded {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"ok":false,"error":{"code":"server_busy","message":"الخادم مشغول الآن — أعد المحاولة بعد لحظات.","details":{}}}';
    }

    location / {
        proxy_pass $hr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
