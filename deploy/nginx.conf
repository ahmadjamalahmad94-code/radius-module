# HobeRadius — nginx reverse proxy (افتراضي HTTP-only)
#
# هذا الـ config يعمل من اللحظة الأولى بدون شهادة TLS. كافٍ للوصول عبر
# http://<VPS_IP>/ مباشرة. لـ TLS مع دومين فعلي:
#   1. shell: sudo bash deploy/deploy.sh tls <domain>
#   2. أو يدوياً: انسخ deploy/nginx.tls.conf.example فوق nginx.conf
#      مع استبدال <DOMAIN>.

upstream hoberadius_app {
    # اسم الخدمة في docker-compose = hoberadius. docker DNS يحلّه داخل
    # شبكة hrnet.
    server hoberadius:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge — يبقى نشطاً ليعمل deploy.sh tls لاحقاً دون تعديل
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location /static/ {
        proxy_pass http://hoberadius_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location = /admin/radius/_health {
        proxy_pass http://hoberadius_app;
        access_log off;
    }

    location / {
        proxy_pass http://hoberadius_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
