<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>تم الاتصال</title><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="-1"><style>@font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}:root{--font-stack:'Tajawal',sans-serif;--bg-gradient:linear-gradient(180deg,#f0f9ff 0%,#ffffff 100%);--main-gradient:linear-gradient(135deg,#22d3ee 0%,#3b82f6 50%,#a855f7 100%);--text-main:#1e293b;--text-sub:#64748B;--primary-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-stack)!important;-webkit-tap-highlight-color:transparent}body{background:var(--bg-gradient);height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px 20px;color:var(--text-main);position:relative}.top-section{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}.success-icon-box{position:relative;width:120px;height:120px;display:flex;justify-content:center;align-items:center;margin-bottom:20px}.pulse-bg{position:absolute;width:100%;height:100%;background:rgba(34,211,238,0.1);border-radius:50%;animation:p 2s infinite}@keyframes p{0%{transform:scale(0.8);opacity:0.8}100%{transform:scale(1.5);opacity:0}}.check-circle{width:90px;height:90px;background:var(--main-gradient);border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 10px 30px rgba(59,130,246,0.3);position:relative;z-index:2}.check-svg{width:45px;height:45px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:0;animation:d .5s ease}@keyframes d{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}.title-text{font-size:26px;font-weight:800;margin-bottom:5px;color:var(--text-main)}.subtitle-text{font-size:14px;color:var(--text-sub)}.user-badge{background:rgba(59,130,246,0.1);color:#2563eb;padding:5px 15px;border-radius:50px;font-weight:700;margin-top:10px;font-size:13px}.session-card{width:100%;background:#fff;border:1px solid rgba(0,0,0,0.05);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.03);display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.session-item{display:flex;flex-direction:column;gap:4px}.si-label{font-size:11px;color:var(--text-sub);font-weight:600}.si-value{font-size:15px;font-weight:800;color:var(--text-main);font-family:monospace;letter-spacing:.5px}.divider{width:1px;height:30px;background:rgba(0,0,0,0.1)}.bottom-section{width:100%;text-align:center;margin-bottom:10px}.btn-internet{position:relative;width:100%;padding:18px;background:var(--main-gradient);color:#fff;border-radius:16px;text-decoration:none;display:flex;justify-content:center;align-items:center;font-weight:800;font-size:16px;box-shadow:0 10px 20px rgba(59,130,246,0.25);overflow:hidden}.progress-fill{position:absolute;bottom:0;left:0;height:4px;background:rgba(255,255,255,0.5);width:0%;transition:width 3s linear}</style></head><body><div class="top-section"><div class="success-icon-box"><div class="pulse-bg"></div><div class="check-circle"><svg class="check-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div></div><h1 class="title-text">تم الاتصال بنجاح</h1><p class="subtitle-text">مرحباً بعودتك إلى الشبكة</p><div class="user-badge"><span dir="ltr">$(username)</span></div></div><div class="session-card"><div class="session-item"><span class="si-label">وقت بدء الجلسة</span><span class="si-value" id="login-time">--:--</span></div><div class="divider"></div><div class="session-item" style="text-align:left"><span class="si-label">عنوان IP الخاص بك</span><span class="si-value" dir="ltr">$(ip)</span></div></div><div class="bottom-section"><a href="#" class="btn-internet" id="go-btn">الانتقال لصفحة الحالة<div class="progress-fill" id="prog-bar"></div></a></div><script>const now=new Date;document.getElementById('login-time').innerText=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:!0});let targetLink="$(link-status)";(!targetLink||targetLink.trim()==="")&&(targetLink="status.html");document.getElementById('go-btn').href=targetLink;document.addEventListener("DOMContentLoaded",function(){setTimeout(()=>{document.getElementById('prog-bar').style.width="100%"},100);setTimeout(function(){location.href=targetLink},3000)});</script></body></html>
