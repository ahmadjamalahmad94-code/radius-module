<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>تسجيل الخروج</title><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="-1"><style>@font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}:root{--font-stack:'Tajawal',sans-serif;--bg-gradient:linear-gradient(180deg,#f0f9ff 0%,#ffffff 100%);--main-gradient:linear-gradient(135deg,#22d3ee 0%,#3b82f6 50%,#a855f7 100%);--text-main:#1e293b;--text-sub:#64748B;--card-bg:#ffffff;--primary-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-stack)!important;-webkit-tap-highlight-color:transparent}body{background:var(--bg-gradient);height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px 20px;color:var(--text-main);position:relative}.top-section{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}.icon-box-logout{width:100px;height:100px;background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.05);border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,0.05);margin-bottom:20px;position:relative}.static-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid rgba(0,0,0,0.05)}.logout-svg{width:40px;height:40px;color:var(--text-sub);opacity:.8}.title-text{font-size:24px;font-weight:800;margin-bottom:5px;color:var(--text-main)}.subtitle-text{font-size:14px;color:var(--text-sub)}.user-pill-static{margin-top:15px;background:#f1f5f9;color:var(--text-main);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}.report-card{width:100%;background:#fff;border-radius:24px;padding:25px 20px;box-shadow:0 15px 40px rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.03);margin-bottom:30px}.report-title{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:15px;text-align:center;border-bottom:1px dashed rgba(0,0,0,0.1);padding-bottom:10px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stat-item{display:flex;flex-direction:column;align-items:center;gap:5px}.stat-icon{width:35px;height:35px;background:rgba(59,130,246,0.05);border-radius:10px;display:flex;justify-content:center;align-items:center;color:#3b82f6;margin-bottom:2px}.stat-label{font-size:11px;color:var(--text-sub)}.stat-val{font-size:14px;font-weight:800;color:var(--text-main);font-family:monospace}.time-box{grid-column:span 2;background:linear-gradient(90deg,#eff6ff 0%,#f8fafc 100%);padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.bottom-section{width:100%;text-align:center}.btn-reconnect{width:100%;padding:16px;background:var(--main-gradient);color:#fff;border-radius:16px;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:0 10px 20px rgba(59,130,246,0.2);transition:transform .2s}.btn-reconnect:active{transform:scale(.98)}</style></head><body><div class="top-section"><div class="icon-box-logout"><div class="static-ring"></div><svg class="logout-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></div><h1 class="title-text">تم تسجيل الخروج</h1><p class="subtitle-text">نأمل أنك استمتعت بخدمتنا</p><div class="user-pill-static"><span dir="ltr">$(username)</span></div></div><div class="report-card"><div class="report-title">ملخص الجلسة السابقة</div><div class="stats-grid"><div class="time-box"><span class="stat-label" style="font-weight:700">⏱️ مدة الاتصال</span><span class="stat-val" dir="ltr">$(uptime)</span></div><div class="stat-item"><div class="stat-icon">⬇️</div><span class="stat-label">تحميل (Download)</span><span class="stat-val" dir="ltr">$(bytes-out-nice)</span></div><div class="stat-item"><div class="stat-icon">⬆️</div><span class="stat-label">رفع (Upload)</span><span class="stat-val" dir="ltr">$(bytes-in-nice)</span></div></div></div><div class="bottom-section"><a href="$(link-login)" class="btn-reconnect">تسجيل الدخول مجدداً <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg></a></div></body></html>
